<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' http: https: data: blob: ws:; connect-src 'self' http://localhost:* http://127.0.0.1:* https://cdn.tailwindcss.com ws://localhost:* ws://127.0.0.1:*; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com;">
    <title>Đơn Hàng Của Tôi - Yến Nhi Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .tab-active {
            color: #ee4d2d;
            border-bottom: 2px solid #ee4d2d;
        }
        /* Hide all Live Server overlays and notifications */
        body::before,
        body::after,
        #vscode-live-server-indicator,
        [id*="vscode"],
        [class*="live-server"],
        div[style*="position: fixed"][style*="top: 0"],
        div[style*="z-index: 999"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="header-placeholder"></div>

    <main class="pt-20 pb-12 min-h-screen">
        <div class="max-w-7xl mx-auto px-4">
            <div class="mb-6">
                <a href="../index.html" class="inline-flex items-center gap-2 text-gray-600 hover:text-orange-500 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    <span class="font-medium">Quay về trang chủ</span>
                </a>
            </div>

            <h1 class="text-2xl font-bold mb-6">Đơn hàng của tôi</h1>

            <div class="bg-white rounded-lg shadow mb-6">
                <div class="flex border-b overflow-x-auto">
                    <button class="tab-button tab-active px-6 py-4 font-medium whitespace-nowrap" data-tab="all">Tất cả</button>
                    <button class="tab-button px-6 py-4 font-medium whitespace-nowrap text-gray-600 hover:text-gray-900" data-tab="pending">Chờ xác nhận</button>
                    <button class="tab-button px-6 py-4 font-medium whitespace-nowrap text-gray-600 hover:text-gray-900" data-tab="processing">Vận chuyển</button>
                    <button class="tab-button px-6 py-4 font-medium whitespace-nowrap text-gray-600 hover:text-gray-900" data-tab="shipping">Chờ giao hàng</button>
                    <button class="tab-button px-6 py-4 font-medium whitespace-nowrap text-gray-600 hover:text-gray-900" data-tab="completed">Hoàn thành</button>
                    <button class="tab-button px-6 py-4 font-medium whitespace-nowrap text-gray-600 hover:text-gray-900" data-tab="cancelled">Đã hủy</button>
                    <button class="tab-button px-6 py-4 font-medium whitespace-nowrap text-gray-600 hover:text-gray-900" data-tab="return">Trả hàng/Hoàn tiền</button>
                </div>

                <div class="p-4 border-b">
                    <div class="relative">
                        <input type="text" id="searchOrder" placeholder="Bạn có thể tìm kiếm theo tên Shop, ID đơn hàng hoặc Tên Sản phẩm" 
                            class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500">
                        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <div id="ordersList" class="space-y-4"></div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/load-components.js"></script>
    <script src="../js/auth-ui.js"></script>
    <script>
        const API_URL = 'http://localhost:3300/api';
        let currentTab = 'all';
        let allOrders = [];

        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', function() {
                document.querySelectorAll('.tab-button').forEach(btn => {
                    btn.classList.remove('tab-active');
                    btn.classList.add('text-gray-600', 'hover:text-gray-900');
                });
                this.classList.add('tab-active');
                this.classList.remove('text-gray-600', 'hover:text-gray-900');
                currentTab = this.dataset.tab;
                filterOrders();
            });
        });

        async function loadOrders() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            allOrders = [
                {
                    id: '1',
                    shopName: 'Shop Benbo',
                    status: 'cancelled',
                    statusText: 'ĐÃ HỦY',
                    products: [{
                        name: 'Đàn guitar acoustic dành cho người mới tập chơi',
                        variant: 'Phân loại hàng: Màu đen',
                        quantity: 1,
                        price: 564999,
                        originalPrice: 750000,
                        image: '../images/Screenshot 2025-11-10 154306.png'
                    }],
                    total: 579499,
                    createdAt: '2025-01-15'
                },
                {
                    id: '2',
                    shopName: 'Xưởng May Bảo Ngọc',
                    status: 'completed',
                    statusText: 'HOÀN THÀNH',
                    deliverySuccess: true,
                    products: [{
                        name: 'Áo Thun Nam Nữ Balen Tay Ngắn Form Rộng',
                        variant: 'Phân loại hàng: Xanh Than, S',
                        quantity: 1,
                        price: 65000,
                        originalPrice: 118000,
                        image: '../images/Screenshot 2025-11-10 154306.png'
                    }],
                    total: 65000,
                    createdAt: '2025-01-10'
                }
            ];

            filterOrders();
        }

        function filterOrders() {
            let filtered = allOrders;
            if (currentTab !== 'all') {
                filtered = allOrders.filter(order => order.status === currentTab);
            }
            renderOrders(filtered);
        }

        function renderOrders(orders) {
            const ordersList = document.getElementById('ordersList');
            if (orders.length === 0) {
                ordersList.innerHTML = '<div class="bg-white rounded-lg shadow p-12 text-center"><p class="text-gray-500 text-lg">Chưa có đơn hàng</p></div>';
                return;
            }

            ordersList.innerHTML = orders.map(order => '<div class="bg-white rounded-lg shadow"><div class="flex items-center justify-between px-6 py-3 border-b bg-gray-50"><div class="flex items-center gap-4"><span class="font-medium">Yêu thích</span><span class="font-semibold">' + order.shopName + '</span><button class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50">Xem Shop</button></div><div class="flex items-center gap-2">' + (order.deliverySuccess ? '<span class="text-green-600 text-sm">✓ Giao hàng thành công</span>' : '') + '<span class="text-orange-500 font-semibold">' + order.statusText + '</span></div></div><div class="p-6">' + order.products.map(product => '<div class="flex gap-4 mb-4"><img src="' + product.image + '" alt="' + product.name + '" class="w-20 h-20 object-cover rounded border"><div class="flex-1"><h3 class="font-medium mb-1 line-clamp-2">' + product.name + '</h3><p class="text-sm text-gray-600 mb-2">' + product.variant + '</p><p class="text-sm text-gray-600">x' + product.quantity + '</p></div><div class="text-right">' + (product.originalPrice ? '<p class="text-sm text-gray-400 line-through">' + product.originalPrice.toLocaleString('vi-VN') + 'đ</p>' : '') + '<p class="text-orange-500 font-medium">' + product.price.toLocaleString('vi-VN') + 'đ</p></div></div>').join('') + '</div><div class="px-6 py-4 border-t bg-gray-50"><div class="flex items-center justify-between"><div class="text-sm text-gray-600">Đã hủy bởi bạn</div><div class="flex items-center gap-6"><div class="text-right"><span class="text-gray-600">Thành tiền:</span><span class="text-2xl font-semibold text-orange-500 ml-2">' + order.total.toLocaleString('vi-VN') + 'đ</span></div><div class="flex gap-2">' + (order.status === 'cancelled' ? '<button class="px-6 py-2 border border-gray-300 rounded hover:bg-gray-50">Mua Lại</button><button class="px-6 py-2 border border-gray-300 rounded hover:bg-gray-50">Xem Chi Tiết Hủy Đơn</button><button class="px-6 py-2 border border-gray-300 rounded hover:bg-gray-50">Liên Hệ Người Bán</button>' : '') + (order.status === 'completed' ? '<button class="px-6 py-2 border border-gray-300 rounded hover:bg-gray-50">Mua Lại</button><button class="px-6 py-2 border border-gray-300 rounded hover:bg-gray-50">Liên Hệ Người Bán</button>' : '') + '</div></div></div></div></div>').join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadOrders();
        });

        // Update cart badge from localStorage
        function updateCartBadge() {
            const cartBadge = document.querySelector('.cart-badge');
            if (cartBadge) {
                const user = JSON.parse(localStorage.getItem('user'));
                const cartKey = user ? `cart_${user.ma_tai_khoan}` : 'cart_guest';
                const cart = JSON.parse(localStorage.getItem(cartKey) || '[]');
                const totalItems = cart.reduce((sum, item) => sum + (parseInt(item.quantity) || parseInt(item.so_luong) || 0), 0);
                cartBadge.textContent = totalItems || 0;
            }
        }
    </script>
</body>
</html>
