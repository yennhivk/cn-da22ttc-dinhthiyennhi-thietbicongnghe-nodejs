<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản của tôi - Yến Nhi Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-gradient-to-r from-yellow-500 to-yellow-400 shadow-lg fixed top-0 left-0 right-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <a href="../index.html" class="flex items-center gap-2">
                    <img src="../images/Screenshot 2025-11-10 154306.png" alt="Logo" class="w-12 h-12 rounded-full">
                    <span class="text-xl font-bold text-red-600">Yến Nhi</span>
                    <span class="text-xl font-bold text-blue-500 italic">Tech</span>
                </a>
                <a href="../index.html" class="text-black hover:text-red-600 font-semibold">← Quay lại trang chủ</a>
            </div>
        </div>
    </nav>

    <div class="pt-24 pb-12 px-4">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold text-gray-800 mb-8">Tài khoản của tôi</h1>
            
            <div class="grid md:grid-cols-3 gap-6">
                <!-- Sidebar -->
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <div class="text-center mb-6">
                        <!-- Avatar -->
                        <div class="relative inline-block">
                            <div id="avatarPreview" class="w-32 h-32 rounded-full bg-orange-100 flex items-center justify-center border-4 border-orange-300 overflow-hidden mx-auto">
                                <svg id="defaultAvatar" class="w-16 h-16 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                <img id="avatarImg" class="w-full h-full object-cover hidden" alt="Avatar">
                            </div>
                            <label for="avatarInput" class="absolute bottom-0 right-0 bg-orange-500 text-white p-2 rounded-full cursor-pointer hover:bg-orange-600 transition" title="Thay đổi ảnh đại diện">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                            </label>
                            <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="uploadAvatar(event)">
                        </div>
                        <p id="uploadStatus" class="text-sm text-gray-500 mt-2"></p>
                        <h2 id="userName" class="text-xl font-bold text-gray-800 mt-2"></h2>
                        <p id="userEmail" class="text-gray-500"></p>
                    </div>

                    <nav class="space-y-2">
                        <a href="#" class="block py-2 px-4 bg-orange-50 text-orange-600 rounded-lg font-medium">Thông tin tài khoản</a>
                        <a href="orders.html" class="block py-2 px-4 text-gray-600 hover:bg-gray-50 rounded-lg">Đơn hàng của tôi</a>
                        <button onclick="handleLogout()" class="w-full text-left py-2 px-4 text-red-500 hover:bg-red-50 rounded-lg">Đăng xuất</button>
                    </nav>
                </div>

                <!-- Main Content -->
                <div class="md:col-span-2 bg-white rounded-xl shadow-lg p-6">
                    <h3 class="text-xl font-bold text-gray-800 mb-6">Thông tin cá nhân</h3>
                    
                    <form id="profileForm" class="space-y-4">
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">Họ và tên</label>
                            <input type="text" id="fullName" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-orange-500 focus:outline-none" placeholder="Nhập họ và tên">
                        </div>
                        
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">Email</label>
                            <input type="email" id="email" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg bg-gray-100" readonly>
                        </div>

                        <div class="pt-4">
                            <button type="submit" class="w-full bg-orange-500 text-white font-bold py-3 rounded-lg hover:bg-orange-600 transition">
                                Cập nhật thông tin
                            </button>
                        </div>
                    </form>


                    <!-- Change Password Section -->
                    <div class="mt-8 pt-8 border-t">
                        <h3 class="text-xl font-bold text-gray-800 mb-6">Đổi mật khẩu</h3>
                        <form id="passwordForm" class="space-y-4">
                            <div>
                                <label class="block text-gray-700 font-medium mb-2">Mật khẩu hiện tại</label>
                                <input type="password" id="currentPassword" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-orange-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-gray-700 font-medium mb-2">Mật khẩu mới</label>
                                <input type="password" id="newPassword" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-orange-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-gray-700 font-medium mb-2">Xác nhận mật khẩu mới</label>
                                <input type="password" id="confirmPassword" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-orange-500 focus:outline-none">
                            </div>
                            <button type="submit" class="bg-gray-800 text-white font-bold py-3 px-6 rounded-lg hover:bg-gray-900 transition">
                                Đổi mật khẩu
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3300/api';
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user'));
            
            if (!token || !user) {
                alert('Vui lòng đăng nhập để tiếp tục');
                window.location.href = 'login.html';
                return;
            }
            
            currentUser = user;
            loadUserInfo();
        });

        function loadUserInfo() {
            document.getElementById('userName').textContent = currentUser.ten_dang_nhap;
            document.getElementById('userEmail').textContent = currentUser.email;
            document.getElementById('fullName').value = currentUser.ten_dang_nhap;
            document.getElementById('email').value = currentUser.email;
            
            if (currentUser.hinh_anh) {
                showAvatar(API_URL.replace('/api', '') + currentUser.hinh_anh);
            }
        }

        function showAvatar(url) {
            const img = document.getElementById('avatarImg');
            const defaultAvatar = document.getElementById('defaultAvatar');
            img.src = url;
            img.onload = function() {
                img.classList.remove('hidden');
                defaultAvatar.classList.add('hidden');
            };
            img.onerror = function() {
                img.classList.add('hidden');
                defaultAvatar.classList.remove('hidden');
            };
        }

        // Upload avatar trực tiếp
        async function uploadAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Validate file size (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                alert('File ảnh quá lớn! Vui lòng chọn ảnh nhỏ hơn 5MB');
                return;
            }

            const statusEl = document.getElementById('uploadStatus');
            statusEl.textContent = 'Đang tải lên...';
            statusEl.className = 'text-sm text-blue-500 mt-2';

            // Preview ảnh ngay
            const reader = new FileReader();
            reader.onload = function(e) {
                showAvatar(e.target.result);
            };
            reader.readAsDataURL(file);

            // Upload lên server
            const formData = new FormData();
            formData.append('avatar', file);

            try {
                const response = await fetch(`${API_URL}/auth/upload-avatar`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: formData
                });

                const data = await response.json();
                
                if (data.success) {
                    // Cập nhật localStorage
                    currentUser.hinh_anh = data.data.hinh_anh;
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    
                    statusEl.textContent = '✓ Cập nhật ảnh đại diện thành công!';
                    statusEl.className = 'text-sm text-green-600 mt-2 font-medium';
                    
                    // Hiển thị alert để user biết rõ
                    alert('Cập nhật ảnh đại diện thành công!');
                    
                    setTimeout(() => {
                        statusEl.textContent = '';
                    }, 5000);
                } else {
                    statusEl.textContent = '✗ ' + (data.message || 'Upload thất bại');
                    statusEl.className = 'text-sm text-red-500 mt-2 font-medium';
                    alert('Upload thất bại: ' + (data.message || 'Vui lòng thử lại'));
                }
            } catch (error) {
                console.error('Error:', error);
                statusEl.textContent = '✗ Không thể kết nối đến server';
                statusEl.className = 'text-sm text-red-500 mt-2 font-medium';
                alert('Lỗi: Không thể kết nối đến server');
            }
        }

        // Update profile
        document.getElementById('profileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            
            try {
                const response = await fetch(`${API_URL}/auth/update-profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        ten_dang_nhap: fullName
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    currentUser.ten_dang_nhap = fullName;
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    alert('Cập nhật thông tin thành công!');
                    window.location.href = '../index.html';
                } else {
                    alert(data.message || 'Cập nhật thất bại');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Không thể kết nối đến server');
            }
        });

        // Change password
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                alert('Mật khẩu xác nhận không khớp!');
                return;
            }
            
            if (newPassword.length < 6) {
                alert('Mật khẩu mới phải có ít nhất 6 ký tự!');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/change-password`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        mat_khau_cu: currentPassword,
                        mat_khau_moi: newPassword
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    alert('Đổi mật khẩu thành công!');
                    document.getElementById('passwordForm').reset();
                } else {
                    alert(data.message || 'Đổi mật khẩu thất bại');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Không thể kết nối đến server');
            }
        });

        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
