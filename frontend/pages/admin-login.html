<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Admin - Yến Nhi Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .admin-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .google-btn {
            transition: all 0.3s ease;
        }
        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .shield-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body>
    <div class="admin-card w-full max-w-md p-10 m-4">
        <!-- Shield Icon -->
        <div class="shield-icon">
            <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
        </div>

        <!-- Title -->
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Quản Trị Viên</h1>
        <p class="text-center text-gray-600 mb-8">Đăng nhập bằng tài khoản Google để truy cập trang quản trị</p>

        <!-- Alert Message -->
        <div id="alert-message" class="hidden mb-6 p-4 rounded-lg"></div>

        <!-- Google Login Only -->
        <button 
            onclick="loginWithGoogle()" 
            class="google-btn w-full bg-white border-2 border-gray-300 text-gray-700 font-semibold py-4 px-6 rounded-xl hover:bg-gray-50 transition duration-300 shadow-md mb-6"
        >
            <span class="flex items-center justify-center gap-3">
                <svg class="w-6 h-6" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Đăng nhập với Google
            </span>
        </button>

        <!-- Security Note -->
        <div class="mt-8 p-4 bg-purple-50 rounded-lg border border-purple-200">
            <p class="text-sm text-center text-purple-700">
                <svg class="w-4 h-4 inline mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                </svg>
                Chỉ dành cho quản trị viên có quyền truy cập
            </p>
        </div>

        <!-- Back to Home -->
        <div class="mt-6 text-center">
            <a href="../index.html" class="text-purple-600 hover:text-purple-700 font-medium text-sm transition">
                ← Về trang chủ
            </a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3300/api';

        // Hiển thị thông báo
        function showAlert(message, type = 'error') {
            const alertDiv = document.getElementById('alert-message');
            alertDiv.className = `mb-6 p-4 rounded-lg ${
                type === 'error' ? 'bg-red-100 text-red-700 border border-red-300' : 
                'bg-green-100 text-green-700 border border-green-300'
            }`;
            alertDiv.textContent = message;
            alertDiv.classList.remove('hidden');

            setTimeout(() => {
                alertDiv.classList.add('hidden');
            }, 5000);
        }

        // Đăng nhập Google cho Admin
        function loginWithGoogle() {
            // Redirect đến Google OAuth cho admin
            window.location.href = `${API_URL}/auth/google-admin`;
        }

        // Kiểm tra nếu đã đăng nhập admin
        window.addEventListener('DOMContentLoaded', () => {
            const adminToken = localStorage.getItem('admin_token');
            const adminUser = localStorage.getItem('admin_user');

            if (adminToken && adminUser) {
                try {
                    const user = JSON.parse(adminUser);
                    if (user.vai_tro === 'admin') {
                        // Đã đăng nhập, chuyển về admin
                        window.location.href = 'admin.html';
                    }
                } catch (e) {
                    // Invalid data, clear it
                    localStorage.removeItem('admin_token');
                    localStorage.removeItem('admin_user');
                }
            }

            // Kiểm tra message từ URL
            const urlParams = new URLSearchParams(window.location.search);
            const message = urlParams.get('message');
            if (message) {
                showAlert(decodeURIComponent(message));
            }
        });
    </script>
</body>
</html>
