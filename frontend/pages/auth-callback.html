<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../images/Screenshot 2025-11-10 154306.png">
    <title>Ðang x? lý dang nh?p...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, 'Noto Sans', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .loader-container {
            text-align: center;
            color: white;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="spinner"></div>
        <h2>Ðang x? lý dang nh?p...</h2>
        <p>Vui lòng d?i trong giây lát</p>
    </div>

    <script>
        (function() {
            // L?y token và user t? URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const userStr = urlParams.get('user');
            const error = urlParams.get('error');
            const redirect = urlParams.get('redirect');

            console.log('Token:', token ? 'Có' : 'Không');
            console.log('User string:', userStr);
            console.log('Redirect:', redirect);

            if (error) {
                alert('Ðang nh?p Google th?t b?i: ' + error);
                window.location.replace('login.html');
                return;
            }
            
            if (token && userStr) {
                try {
                    const decodedUserStr = decodeURIComponent(userStr);
                    console.log('Decoded user:', decodedUserStr);
                    
                    const user = JSON.parse(decodedUserStr);
                    console.log('Parsed user:', user);
                    
                    // Luu vào localStorage
                    localStorage.setItem('token', token);
                    localStorage.setItem('user', JSON.stringify(user));
                    
                    console.log('Ðã luu localStorage, dang chuy?n trang...');
                    
                    // Ki?m tra redirect v? admin
                    if (redirect === 'admin') {
                        // Ki?m tra quy?n admin
                        if (user.vai_tro === 'admin') {
                            setTimeout(function() {
                                window.location.href = 'admin.html';
                            }, 500);
                        } else {
                            alert('B?n không có quy?n truy c?p trang qu?n tr?!');
                            localStorage.removeItem('token');
                            localStorage.removeItem('user');
                            setTimeout(function() {
                                window.location.href = 'login.html?message=' + encodeURIComponent('B?n không có quy?n truy c?p trang qu?n tr?');
                            }, 500);
                        }
                    } else {
                        // Chuy?n v? trang ch?
                        setTimeout(function() {
                            window.location.href = '../index.html';
                        }, 500);
                    }
                } catch (e) {
                    console.error('L?i x? lý d? li?u:', e);
                    alert('Có l?i x?y ra khi x? lý dang nh?p: ' + e.message);
                    window.location.replace('login.html');
                }
            } else {
                alert('Không tìm th?y thông tin dang nh?p');
                window.location.replace('login.html');
            }
        })();
    </script>
    <!-- Chatbot Widget -->
    <link rel="stylesheet" href="../css/chatbot.css">
    <script src="../js/chatbot.js"></script>

    <!-- Search Suggestions -->
    <script src="../js/search-suggestions.js?v=1"></script>
</body>
</html>
