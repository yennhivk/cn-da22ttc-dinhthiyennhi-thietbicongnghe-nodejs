<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoMo - Đang xử lý thanh toán</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .momo-gradient {
            background: linear-gradient(135deg, #a50064 0%, #d82d8b 100%);
        }
        .scan-line {
            animation: scan 1.5s ease-in-out infinite;
        }
        @keyframes scan {
            0%, 100% { top: 10%; opacity: 0.5; }
            50% { top: 80%; opacity: 1; }
        }
        .pulse {
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .checkmark {
            animation: checkmark 0.5s ease-out forwards;
        }
        @keyframes checkmark {
            0% { stroke-dashoffset: 100; }
            100% { stroke-dashoffset: 0; }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="momo-gradient min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Header -->
        <div class="text-center mb-6">
            <img src="https://developers.momo.vn/v3/vi/assets/images/icon-52bd5808cecdb1970e1aeec3c31a3ee1.png" 
                 alt="MoMo" class="w-16 h-16 mx-auto mb-2">
            <h1 class="text-white text-2xl font-bold">MoMo Payment</h1>
            <p class="text-pink-200 text-sm">Thanh toán an toàn & nhanh chóng</p>
        </div>

        <!-- Main Card -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <!-- Order Info -->
            <div class="p-6 border-b bg-gray-50">
                <div class="flex justify-between items-center mb-2"></div>
                    <div cllass="text-gray-500">Đơn hàng:</span>
                    <span id="orderId" class="font-bold text-lg">#---</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">Số tiền:</span>
                    <span id="amount" class="font-bold text-2xl text-pink-600">0 ₫</span>
                </div>
            </div>

            <!-- QR Scanning Section -->
            <div id="scanningSection" class="p-8 text-center">
                <!-- QR Code with scanning effect -->
                <div class="relative inline-block mb-6">
                    <div class="w-52 h-52 bg-white rounded-xl border-4 border-pink-500 p-3 relative overflow-hidden">
                        <!-- QR Pattern -->
                        <div class="w-full h-full grid grid-cols-10 gap-0.5">
                            <script>
                                for(let i = 0; i < 100; i++) {
                                    const isBlack = Math.random() > 0.5;
                                    document.write(`<div class="bg-${isBlack ? 'gray-800' : 'white'}"></div>`);
                                }
                            </script>
                        </div>
                        <!-- Center MoMo logo -->
                        <div class="absolute inset-0 flex items-center justify-center">
                            <div class="w-14 h-14 bg-white rounded-lg shadow-lg flex items-center justify-center">
                                <img src="https://developers.momo.vn/v3/vi/assets/images/icon-52bd5808cecdb1970e1aeec3c31a3ee1.png" 
                                     alt="MoMo" class="w-10 h-10">
                            </div>
                        </div>
                        <!-- Scanning line -->
                        <div class="scan-line absolute left-0 right-0 h-1 bg-gradient-to-r from-transparent via-pink-500 to-transparent"></div>
                    </div>
                    <!-- Corner decorations -->
                    <div class="absolute -top-1 -left-1 w-6 h-6 border-t-4 border-l-4 border-pink-600 rounded-tl-lg"></div>
                    <div class="absolute -top-1 -right-1 w-6 h-6 border-t-4 border-r-4 border-pink-600 rounded-tr-lg"></div>
                    <div class="absolute -bottom-1 -left-1 w-6 h-6 border-b-4 border-l-4 border-pink-600 rounded-bl-lg"></div>
                    <div class="absolute -bottom-1 -right-1 w-6 h-6 border-b-4 border-r-4 border-pink-600 rounded-br-lg"></div>
                </div>

                <div class="pulse">
                    <p class="text-gray-700 font-semibold text-lg">Đang quét mã QR...</p>
                    <p id="statusText" class="text-gray-500 mt-2">Vui lòng chờ trong giây lát</p>
                </div>

                <!-- Progress bar -->
                <div class="mt-6 bg-gray-200 rounded-full h-2 overflow-hidden">
                    <div id="progressBar" class="bg-pink-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <p id="countdown" class="text-pink-600 font-semibold mt-2">3 giây</p>
            </div>

            <!-- Success Section (hidden initially) -->
            <div id="successSection" class="p-8 text-center hidden">
                <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-14 h-14 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path class="checkmark" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" 
                              d="M5 13l4 4L19 7" stroke-dasharray="100" stroke-dashoffset="100"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-green-600 mb-2">Thanh toán thành công!</h2>
                <p class="text-gray-500">Đang chuyển hướng...</p>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-pink-200 text-sm mt-6">
            🔒 Giao dịch được bảo mật bởi MoMo
        </p>
    </div>

    <script>
        const API_URL = 'http://localhost:3300/api';
        let orderData = {};

        document.addEventListener('DOMContentLoaded', function() {
            // Lấy thông tin từ URL params
            const urlParams = new URLSearchParams(window.location.search);
            
            orderData = {
                orderId: urlParams.get('orderId') || '',
                amount: urlParams.get('amount') || '0',
                orderInfo: urlParams.get('orderInfo') || '',
                requestId: urlParams.get('requestId') || ''
            };

            // Hiển thị thông tin
            const originalOrderId = orderData.orderId.split('_')[0].replace('YNT', '');
            document.getElementById('orderId').textContent = '#' + originalOrderId;
            document.getElementById('amount').textContent = formatCurrency(parseInt(orderData.amount));

            // Bắt đầu quá trình quét tự động
            startAutoScan();
        });

        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN', { 
                style: 'currency', 
                currency: 'VND' 
            }).format(amount);
        }

        function startAutoScan() {
            const progressBar = document.getElementById('progressBar');
            const countdown = document.getElementById('countdown');
            const statusText = document.getElementById('statusText');
            
            let timeLeft = 3;
            let progress = 0;

            const statusMessages = [
                'Đang kết nối đến MoMo...',
                'Đang xác thực giao dịch...',
                'Đang xử lý thanh toán...'
            ];

            // Update progress every 100ms
            const progressInterval = setInterval(() => {
                progress += 3.33;
                progressBar.style.width = Math.min(progress, 100) + '%';
            }, 100);

            // Update countdown every second
            const countdownInterval = setInterval(() => {
                timeLeft--;
                countdown.textContent = timeLeft + ' giây';
                statusText.textContent = statusMessages[2 - timeLeft] || statusMessages[2];
                
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    clearInterval(progressInterval);
                    progressBar.style.width = '100%';
                    
                    // Hiển thị thành công và xử lý thanh toán
                    showSuccessAndProcess();
                }
            }, 1000);
        }

        async function showSuccessAndProcess() {
            // Ẩn phần scanning, hiện phần success
            document.getElementById('scanningSection').classList.add('hidden');
            document.getElementById('successSection').classList.remove('hidden');
            document.getElementById('successSection').classList.add('fade-in');

            try {
                // Gọi API để cập nhật trạng thái thanh toán
                const response = await fetch(`${API_URL}/payment/momo/simulate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        orderId: orderData.orderId,
                        result: 'success',
                        amount: orderData.amount
                    })
                });

                const data = await response.json();
                console.log('Payment result:', data);

                // Chờ 1.5s để user thấy thông báo thành công
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Lấy orderId gốc và redirect
                const originalOrderId = orderData.orderId.split('_')[0].replace('YNT', '');
                window.location.href = `payment-result.html?status=success&orderId=${originalOrderId}&transId=MOMO_${Date.now()}`;

            } catch (error) {
                console.error('Error:', error);
                alert('Có lỗi xảy ra. Vui lòng thử lại.');
                window.location.href = 'checkout.html';
            }
        }
    </script>
</body>
</html>
